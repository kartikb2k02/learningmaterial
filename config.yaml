baseURL: https://product.kartikbhalerao.in/
title: Prodloop
locale: en
enableGitInfo: false
disableKinds: [taxonomy, term, rss]
enableRobotsTXT: true

# ─────────────────────────────────────────────────────────────────────────────
# COURSES
# Every course is a plain folder of markdown at the repo root. To publish one,
# add its folder name below. Folders that are not listed are ignored.
#
# Conventions the site understands (all optional):
#   README.md in a folder        → that folder's landing page
#   a folder inside a course     → a topic; its order comes from `levels` below
#   01-, 02-… file/folder prefix → lesson order
#   first "# Heading" in a file  → page title
#   ```mermaid fenced blocks     → rendered diagrams
#   "Level: … | Estimated time: … min" header block → difficulty, prerequisites, time
# ─────────────────────────────────────────────────────────────────────────────
params:
  hero:
    title: How AI products are actually built
  footer: Prodloop is a working library for people who build AI products.
  seo:
    home_title: "AI Product Management, Evals, Pricing and Metrics | Prodloop"
    description: "Practitioner courses on building AI products: specifying behaviour you cannot pin down, evaluating output you cannot assert on, pricing a feature whose cost scales with use, and the metrics for all of it."
    image: social-card.png
  author:
    name: Kartik Bhalerao
    url: https://github.com/kartikb2k02
  # github: https://github.com/kartikb2k02/learningmaterial

  # The learning levels, in order. Every topic of every course belongs to one.
  levels:
    - key: foundations
      name: Foundations
      blurb: The whole product function, with no model in it.
    - key: basic
      name: Basic
      blurb: What a model is, and what it changes.
    - key: intermediate
      name: Intermediate
      blurb: Build with a model in the product.
    - key: advanced
      name: Advanced
      blurb: Ship it safely, and survive the next release.
    - key: expert
      name: Expert
      blurb: Measure it, cost it, and build the real thing.
    - key: sectors
      name: Sectors
      blurb: The same job, bent by the market it runs in.

  courses:
    - dir: product-management
      short: Product
      summary: "The product function from first principles, and what changes once there is a model in the product."
      levels:
        foundations:  [the-product-function, starting-in-product, customers-and-users, discovery-and-problem-framing, definition-and-delivery, roadmapping-and-prioritisation, product-strategy, pricing-and-packaging, design-and-user-experience, technical-foundations, the-cross-functional-loop, how-to-read-a-metric]
        basic:        [what-a-model-changes, model-primitives, discovery-for-ai-products]
        intermediate: [specs-for-non-deterministic-systems, context-and-knowledge, agents-and-autonomy, ai-product-ux]
        advanced:     [evaluation-and-quality, trust-safety-and-guardrails, ai-pricing-and-packaging, model-lifecycle-and-drift]
        expert:       [funnel-retention-and-experiments, revenue-and-efficiency, business-fundamentals-for-product, ai-quality-metrics, ai-cost-and-margin, agent-and-task-metrics, benchmarks-and-their-limits, data-moats-and-feedback-loops, ai-product-org-and-process, worked-ai-products]
        sectors:      [product-by-sector]

    - dir: growth-engineering
      title: Growth Engineering
      short: Growth
      summary: "Growth as a system rather than a list of tactics: the loops, the model, and the experiment machine."
      soon: true

    - dir: gtm-engineering
      title: GTM Engineering
      short: GTM
      summary: "Taking a product to a market: the buyer, the positioning, the motion, and pipeline arithmetic that holds."
      soon: true

    - dir: revenue-operations
      title: Revenue Operations
      short: Operations
      summary: "The machinery underneath: operating cadence, the funnel as a data model, systems of record and process."
      soon: true

    - dir: ai-engineering
      title: AI Engineering
      short: AI
      summary: "Building products with a model inside them: context, agents, evaluation, and what it costs to run."
      soon: true

# Lets `hugo server` live reload when a course file changes. Courses are read from
# the repo root by content/_content.gotmpl, not from content/.
# When you add a course, add a mount for it here too.
module:
  mounts:
    - source: content
      target: content
    - source: assets
      target: assets
    - source: product-management
      target: assets/_watch/product-management

outputs:
  home: [html, json]
  section: [html]
  page: [html]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
