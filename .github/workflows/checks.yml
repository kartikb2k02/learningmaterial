name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The layouts directory uses the template system introduced in Hugo
      # v0.146.0 (layouts/_partials, and baseof/home/page/section at the root).
      # Anything older cannot find a single partial and the build dies on the
      # first page. Keep this in step with the version in the README.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      # One gate, the same script that runs locally, so CI and a laptop cannot
      # disagree about whether the library is publishable.
      - run: ./check.sh
